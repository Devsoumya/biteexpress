# Local-only credentials (defaults below); override MONGO_ROOT_USERNAME and
# MONGO_ROOT_PASSWORD in .env.

services:
  mongo:
    # Atlas Local: mongod + mongot, so $search works. Pinned by digest.
    image: mongodb/mongodb-atlas-local:8.0@sha256:5cf57bb433ad0fc9c9e44df0a883c804034e395e0083efc04ecdfbffe7044be5
    hostname: mongo
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-biteexpress}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-dev-only}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    # No volume: every `down` + `up` starts from a clean, reseedable state.
    healthcheck:
      # The image's own check; only the timing is overridden (its default
      # 30 s interval would delay the API by about 30 s).
      test: ['CMD', '/usr/local/bin/runner', 'healthcheck']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  api:
    build:
      context: .
      target: runtime
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-biteexpress}:${MONGO_ROOT_PASSWORD:-local-dev-only}@mongo:27017/biteexpress?authSource=admin&directConnection=true
      TENANT_ID: ${TENANT_ID:-biteexpress}
      SEARCH_INDEX_NAME: ${SEARCH_INDEX_NAME:-restaurants_search}
      QUERY_MAX_TIME_MS: ${QUERY_MAX_TIME_MS:-2000}
      BEST_MIN_VOTES: ${BEST_MIN_VOTES:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    # Liveness until Step 3 adds the seed and search index; then /ready.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-biteexpress}:${MONGO_ROOT_PASSWORD:-local-dev-only}@mongo:27017/biteexpress_test?authSource=admin&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    command: ['npm', 'test']
